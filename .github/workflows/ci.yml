name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type-check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Tests (includes the security and route-guard tests)
        run: npm test -- --ci

  migrations:
    name: Migrations match schema.prisma
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci?schema=public
    steps:
      - uses: actions/checkout@v4
      # Checked once the migration baseline exists (npm run db:baseline).
      - name: Look for the migration baseline
        id: baseline
        run: |
          if [ -f prisma/migrations/0_baseline/migration.sql ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No migration baseline yet (run npm run db:baseline); skipping the migration check."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.baseline.outputs.present == 'true'
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        if: steps.baseline.outputs.present == 'true'
      - name: Apply the committed migrations to an empty database
        if: steps.baseline.outputs.present == 'true'
        run: npx prisma migrate deploy
      - name: Fail if schema.prisma has changes without a migration
        if: steps.baseline.outputs.present == 'true'
        run: |
          if ! npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code; then
            echo "::error::prisma/schema.prisma changed without a migration. Run 'npm run db:migrate' and commit the new migration."
            npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --script
            exit 1
          fi
